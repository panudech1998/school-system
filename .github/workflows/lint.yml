name: Lint

on:
  push:
    branches: ["agent/swk-phonto-mvp"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint PHP files
        run: find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Compile Python source
        run: python -m py_compile face-service/app.py
